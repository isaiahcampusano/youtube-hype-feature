services:
  - type: web
    name: youtube-hype-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/hype.db
      - key: HYPE_EXPERIMENT_ENABLED
        value: "true"
      - key: HYPE_WEEKEND_BONUS_MODE
        value: unlimited
